name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # pnpm before node: the version comes from packageManager, and the cache needs its store.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - run: pnpm test
      - run: pnpm run build

      # The tag must name the version the bundle reports, or a release lies about itself.
      - name: Check the tag matches package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(node -p "require('./package.json').version")"
          test "$tagged" = "$packaged" ||
            { echo "tag $tagged != package.json $packaged"; exit 1; }

      - run: tar -czf "kamargin-${GITHUB_REF_NAME}.tar.gz" -C dist .
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: kamargin-*.tar.gz
