<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kamargin — Dofus craft margins</title>
    <meta
      name="description"
      content="A client-side Dofus market calculator: price ingredients, rank every craft by margin, and snapshot what a craft was worth. Runs in your browser, no account."
    />
    <link rel="canonical" href="https://aghazy94.github.io/kamargin/" />
    <!-- Painted before the theme script runs, so the value cannot come from CSS; keep in step with --background. -->
    <meta
      name="theme-color"
      data-scheme="light"
      media="(prefers-color-scheme: light)"
      content="#f1f0ed"
    />
    <meta
      name="theme-color"
      data-scheme="dark"
      media="(prefers-color-scheme: dark)"
      content="#0b0a08"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-title" content="Kamargin" />

    <!-- PNG fallbacks: an SVG-only favicon is ignored by older Safari and every touch icon. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="./favicon-96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kamargin" />
    <meta property="og:title" content="Kamargin — Dofus craft margins" />
    <meta
      property="og:description"
      content="Price ingredients, rank every craft by margin, and snapshot what a craft was worth. Runs entirely in your browser."
    />
    <meta property="og:url" content="https://aghazy94.github.io/kamargin/" />
    <meta
      property="og:image"
      content="https://aghazy94.github.io/kamargin/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Kamargin — know what a craft is worth before you make it."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Item icons are the one host fetched at runtime; the handshake costs a round trip. -->
    <link rel="preconnect" href="https://api.dofusdu.de" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Kamargin",
        "url": "https://aghazy94.github.io/kamargin/",
        "applicationCategory": "UtilitiesApplication",
        "applicationSubCategory": "Dofus",
        "operatingSystem": "Any browser",
        "browserRequirements": "Requires JavaScript",
        "softwareVersion": "%APP_VERSION%",
        "inLanguage": "en",
        "screenshot": "https://aghazy94.github.io/kamargin/screenshots/craft-cost.png",
        "description": "A client-side Dofus market calculator: price ingredients, rank every craft by margin, and snapshot what a craft was worth.",
        "featureList": [
          "Read marketplace prices from a screenshot, on-device",
          "Cost one recipe across all four pack sizes",
          "Rank every reachable craft by margin",
          "Snapshot and restore a price book",
          "Works offline; no account and no server"
        ],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": {
          "@type": "Person",
          "name": "Ahmed Ghazy",
          "url": "https://github.com/AGhazy94"
        },
        "isAccessibleForFree": true
      }
    </script>

    <!-- Before first paint, or a light resolution flashes dark. -->
    <script>
      try {
        let t = JSON.parse(localStorage.getItem('theme')) || 'dark'
        if (t === 'system')
          t = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        document.documentElement.classList.remove('light', 'dark')
        document.documentElement.classList.add(t)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
